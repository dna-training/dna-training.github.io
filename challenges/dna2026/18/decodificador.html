
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decodificador</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0D0D0A;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Special Elite', Georgia, serif;
  padding: 2rem;
}

.wrap {
  width: 100%;
  max-width: 480px;
}

h1 {
  text-align: center;
  font-size: 22px;
  font-weight: 400;
  color: #FFFFFF;
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-bottom: 2rem;
}

.machine {
  background: #1C1C18;
  border: 1px solid #6B6960;
  border-radius: 8px;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}

.machine::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: repeating-linear-gradient(90deg, #8B7355 0, #8B7355 8px, transparent 8px, transparent 16px);
}

.gears {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 1.5rem;
  align-items: center;
}

.gear  { animation: spin   8s linear infinite; transform-origin: center; }
.gear-r{ animation: spin-r 6s linear infinite; transform-origin: center; }
@keyframes spin  { from{transform:rotate(0deg)}   to{transform:rotate(360deg)} }
@keyframes spin-r{ from{transform:rotate(0deg)}   to{transform:rotate(-360deg)} }

.cipher-display {
  background: #0D0D0A;
  border: 1px solid #6B6960;
  border-radius: 6px;
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  text-align: center;
}

.cipher-label {
  font-size: 11px;
  color: #C8C4B8;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.cipher-text {
  font-size: 28px;
  color: #FFFFFF;
  letter-spacing: 10px;
}

.key-inputs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 1.25rem;
}

.key-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.key-box label {
  font-size: 11px;
  color: #C8C4B8;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.key-box input {
  width: 100px;
  height: 52px;
  text-align: center;
  font-family: 'Special Elite', Georgia, serif;
  font-size: 22px;
  letter-spacing: 4px;
  text-transform: uppercase;
  border: 1px solid #6B6960;
  border-radius: 6px;
  background: #0D0D0A;
  color: #FFFFFF;
  outline: none;
  transition: border-color 0.2s;
}

.key-box input:focus {
  border-color: #C8A96E;
}

.key-sep {
  font-size: 30px;
  color: #C8C4B8;
  margin-top: 16px;
  user-select: none;
}

.btn-decode {
  display: block;
  width: 100%;
  height: 52px;
  font-family: 'Special Elite', Georgia, serif;
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid #6B6960;
  border-radius: 6px;
  background: transparent;
  color: #FFFFFF;
  transition: all 0.15s;
}

.btn-decode:hover {
  background: #2C2C28;
  border-color: #C8A96E;
}

.result-area {
  text-align: center;
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid #6B6960;
}

.result-text {
  font-size: 32px;
  letter-spacing: 10px;
  color: #4CAF82;
}

.result-wrong {
  font-size: 13px;
  letter-spacing: 2px;
  color: #C87070;
}

.ticker {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}

.tick {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #4CAF82;
  opacity: 0;
  animation: fadein 0.3s forwards;
}

@keyframes fadein { to { opacity: 1; } }
</style>
</head>
<body>

<!--

<div class="wrap">
  <h1>Decodificador</h1>

  <div class="machine">

    <div class="gears">
      <svg class="gear" width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="10" fill="none" stroke="#8B7355" stroke-width="2"/>
        <circle cx="22" cy="22" r="4" fill="#8B7355"/>
        <g stroke="#8B7355" stroke-width="2.5">
          <line x1="22" y1="4"  x2="22" y2="10"/><line x1="22" y1="34" x2="22" y2="40"/>
          <line x1="4"  y1="22" x2="10" y2="22"/><line x1="34" y1="22" x2="40" y2="22"/>
          <line x1="8"  y1="8"  x2="12.5" y2="12.5"/><line x1="31.5" y1="31.5" x2="36" y2="36"/>
          <line x1="36" y1="8"  x2="31.5" y2="12.5"/><line x1="12.5" y1="31.5" x2="8"  y2="36"/>
        </g>
      </svg>
      <svg class="gear-r" width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="7" fill="none" stroke="#A08060" stroke-width="2"/>
        <circle cx="16" cy="16" r="3" fill="#A08060"/>
        <g stroke="#A08060" stroke-width="2">
          <line x1="16" y1="2"  x2="16" y2="7"/> <line x1="16" y1="25" x2="16" y2="30"/>
          <line x1="2"  y1="16" x2="7"  y2="16"/><line x1="25" y1="16" x2="30" y2="16"/>
          <line x1="5"  y1="5"  x2="9"  y2="9"/> <line x1="23" y1="23" x2="27" y2="27"/>
          <line x1="27" y1="5"  x2="23" y2="9"/> <line x1="9"  y1="23" x2="5"  y2="27"/>
        </g>
      </svg>
      <svg class="gear" width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="13" fill="none" stroke="#C8A96E" stroke-width="2.5"/>
        <circle cx="26" cy="26" r="5" fill="#C8A96E"/>
        <g stroke="#C8A96E" stroke-width="3">
          <line x1="26" y1="3"  x2="26" y2="11"/><line x1="26" y1="41" x2="26" y2="49"/>
          <line x1="3"  y1="26" x2="11" y2="26"/><line x1="41" y1="26" x2="49" y2="26"/>
          <line x1="7"  y1="7"  x2="13" y2="13"/><line x1="39" y1="39" x2="45" y2="45"/>
          <line x1="45" y1="7"  x2="39" y2="13"/><line x1="13" y1="39" x2="7"  y2="45"/>
        </g>
      </svg>
      <svg class="gear-r" width="36" height="36" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="9" fill="none" stroke="#8B7355" stroke-width="2"/>
        <circle cx="18" cy="18" r="3.5" fill="#8B7355"/>
        <g stroke="#8B7355" stroke-width="2">
          <line x1="18" y1="2"  x2="18" y2="8"/> <line x1="18" y1="28" x2="18" y2="34"/>
          <line x1="2"  y1="18" x2="8"  y2="18"/><line x1="28" y1="18" x2="34" y2="18"/>
          <line x1="5"  y1="5"  x2="9.5" y2="9.5"/><line x1="26.5" y1="26.5" x2="31" y2="31"/>
          <line x1="31" y1="5"  x2="26.5" y2="9.5"/><line x1="9.5" y1="26.5" x2="5" y2="27"/>
        </g>
      </svg>
    </div>

    <div class="cipher-display">
      <div class="cipher-label">Mensagem Cifrada</div>
      <div class="cipher-text">P W B Q O Z M S</div>
    </div>

    <div class="key-inputs">
      <div class="key-box">
        <label>Letras</label>
        <input type="text" id="key_letters" maxlength="4" autocomplete="off"
              oninput="this.value=this.value.toUpperCase().replace(/[^A-Z]/g,'')"/>
      </div>

      <div class="key-sep">&mdash;</div>

      <div class="key-box">
        <label>N&uacute;meros</label>
        <input type="text" id="key_numbers" maxlength="3" autocomplete="off"
              oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
      </div>
    </div>

    <button type="button" class="btn-decode" onclick="checkCode()">
      Decodificar
    </button>

    <div class="result-area" id="result"></div>

    <script>
      function checkCode() {
        const letters = document.getElementById("key_letters").value.trim().toUpperCase();
        const numbers = document.getElementById("key_numbers").value.trim();
        const result = document.getElementById("result");

        if (letters === "AIII" && numbers === "118") {
          result.innerHTML = `
            <div class="result-text">
              potiorek
            </div>
            <div class="ticker">
              <div class="tick"></div>
              <div class="tick" style="animation-delay:.1s"></div>
              <div class="tick" style="animation-delay:.2s"></div>
            </div>
          `;
        } else {
          result.innerHTML = `
            <div class="result-wrong">
              CHAVE INCORRETA
            </div>
          `;
        }
      }
    </script>
  </div>
</div>
</body>
</html>
