<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiroshi Miyauchi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap');

    :root {
      --ink: #1a1008;
      --paper: #f5f0e8;
      --red: #c0392b;
      --gold: #b8860b;
      --muted: #6b5c4a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Fundo com textura sutil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,0,0,0.04) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,0,0,0.02) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      text-align: center;
      animation: fadeUp 1s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .kanji-deco {
      font-size: 5rem;
      color: rgba(192,57,43,0.12);
      letter-spacing: 0.2em;
      line-height: 1;
      margin-bottom: 0.5rem;
      font-family: 'Shippori Mincho', serif;
      user-select: none;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: var(--red);
      margin: 0.8rem auto;
    }

    h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .card {
      margin-top: 2.5rem;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 4px;
      padding: 2rem 2.5rem;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
    }

    .card p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--muted);
      margin-bottom: 1.8rem;
    }

    .video-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 2rem;
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      border-radius: 2px;
      transition: background 0.25s, transform 0.2s;
      font-family: 'Noto Serif JP', serif;
    }

    .video-link:hover {
      background: var(--red);
      transform: translateY(-2px);
    }

    .video-link svg {
      flex-shrink: 0;
    }

    .stamp {
      margin-top: 2.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(0,0,0,0.25);
      text-transform: uppercase;
    }

    .red-line {
      display: block;
      width: 1px;
      height: 60px;
      background: var(--red);
      margin: 1.5rem auto 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="kanji-deco">宮内 洋</div>
    <div class="divider"></div>
    <h1>Hiroshi Miyauchi</h1>
    <p class="subtitle">ator · tokusatsu · cinema</p>

    <div class="card">
      <p>
        Hiroshi Miyauchi é um lendário ator japonês de tokusatsu, conhecido por interpretar
        heróis icônicos como Kamen Rider V3, Big One e Zubat. Uma figura marcante
        da televisão e do cinema japonês.
      </p>

      <a class="video-link" href="Extra.mp4" target="_blank">
        <!-- ícone play -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        Assistir
      </a>
    </div>

    <span class="red-line"></span>
    <p class="stamp">arquivo de cinema · hiroshi miyauchi</p>

  </div>

</body>
</html>
