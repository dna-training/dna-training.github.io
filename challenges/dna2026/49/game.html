  --green: #00ff41;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--green);
  font-family: 'Share Tech Mono', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
body::before {
  content:'';

  inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");

  opacity:0.3;
}

#stage {
  width: min(900px, 98vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

/* ── NETWORK SVG ── */
#network-wrap {

  transition: opacity 0.8s;
}

#network-svg {
  width: 100%;

}

/* Servidor SVG */
.srv-body { fill: #0a1a0a; stroke: var(--green-dim); stroke-width: 1.5; }

.srv-stripe { fill: none; stroke: #1a3a1a; stroke-width: 1; }
@keyframes ledBlink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Linhas de rede */
.net-line {
  fill: none;
  stroke: var(--green-dim);
  stroke-width: 1;
  opacity: 0.4;
}

/* Computadores SVG */
.mon-body { fill: #0a0a0a; stroke: #333; stroke-width: 1.5; rx: 2; }
.mon-screen { fill: var(--green-dark); transition: fill 0.4s; }
.mon-screen.bsod { fill: var(--blue-screen) !important; }
.mon-screen.recover { fill: #001a00 !important; }
.mon-stand { fill: #1a1a1a; }
.mon-base { fill: #1a1a1a; }
.mon-text { font-family: 'Share Tech Mono', monospace; font-size: 4px; fill: var(--green); }
.mon-text.bsod-txt { fill: white; }

/* Pacote UPDATE viajando */
.pkg {
  opacity: 0;
  transition: opacity 0.2s;
}
.pkg-box { fill: #001a00; stroke: var(--green); stroke-width: 1; rx: 2; }
.pkg-txt { font-family: 'Orbitron', monospace; font-size: 5px; fill: var(--green); font-weight: 700; letter-spacing: 1px; }

/* Scanlines nos monitors */
.scanlines {
  fill: url(#scan);
  pointer-events: none;
}

  width: min(700px, 95vw);
  opacity: 0;

  transition: opacity 0.6s;

<script>
let fase = 0;
const NUM = 9;
const monX = [50,150,250,350,450,550,650,750,850];

const RESPOSTA_CORRETA = /^C-00000291\*\.sys$/i;
const CODIGO_FINAL = '19072024';

function getScreen(i){ return document.getElementById('ms-'+i); }
function getText(i,s){
  const sfx = s===0?'':s===1?'b':'c';
  return document.getElementById('mt-'+i+(sfx));
}

function animatePkg(i, delay){
  const pkg = document.getElementById('pkg-'+i);
  const tx = monX[i];
  const startX = 450;
  const startY = 90;
  const midY = 130;
  const endY = 175;

  setTimeout(()=>{
    pkg.style.opacity = '1';
    let t = 0;
    const step = 16;

    const phase1 = setInterval(()=>{
      t += step;
      const prog = Math.min(t/400, 1);
      const x = startX;
      const y = startY + (midY - startY)*prog;
      pkg.setAttribute('transform', `translate(${x},${y})`);
      if(prog >= 1){ clearInterval(phase1); phase2(); }
    }, step);

    function phase2(){
      t = 0;
      const phase2i = setInterval(()=>{
        t += step;
        const prog = Math.min(t/500, 1);
        const x = startX + (tx - startX)*prog;
        const y = midY;
        pkg.setAttribute('transform', `translate(${x},${y})`);
        if(prog >= 1){ clearInterval(phase2i); phase3(); }
      }, step);
    }

    function phase3(){
      t = 0;
      const phase3i = setInterval(()=>{
        t += step;
        const prog = Math.min(t/300, 1);
        const x = tx;
        const y = midY + (endY - midY)*prog;
        pkg.setAttribute('transform', `translate(${x},${y})`);
        if(prog >= 1){
          clearInterval(phase3i);
          pkg.style.opacity = '0';
          bsod(i);
        }
      }, step);
    }
  }, delay);
}

function bsod(i){
  const s = getScreen(i);
  s.classList.add('bsod');
  s.parentElement.querySelector('rect.mon-body').setAttribute('stroke','#0078d4');
  getText(i,0).textContent = 'A problem';
  getText(i,0).classList.add('bsod-txt');
  getText(i,1).textContent = 'detected.';
  getText(i,1).classList.add('bsod-txt');
  getText(i,2).textContent = ':( ';
  getText(i,2).classList.add('bsod-txt');
}

function recover(i){
  const s = getScreen(i);
  s.classList.remove('bsod');
  s.classList.add('recover');
  s.parentElement.querySelector('rect.mon-body').setAttribute('stroke','#333');
  getText(i,0).textContent = '> FIXED';
  getText(i,0).classList.remove('bsod-txt');
  getText(i,1).textContent = '> OK ✓';
  getText(i,1).classList.remove('bsod-txt');
  getText(i,2).textContent = '';
  getText(i,2).classList.remove('bsod-txt');
}

// Inicia animação
const wrap = document.getElementById('network-wrap');
setTimeout(()=>{
  wrap.style.opacity = '1';
  for(let i=0;i<NUM;i++){
    animatePkg(i, 800 + i*200);
  }
  setTimeout(()=>{
    const inp = document.getElementById('input-zone');
    inp.style.opacity = '1';
    inp.style.pointerEvents = 'auto';
    document.getElementById('arquivo-input').focus();
    fase = 1;
    let b=0;
    const bi = setInterval(()=>{
      b++;
      for(let i=0;i<NUM;i++){
        const s=getScreen(i);
        if(s.classList.contains('bsod')) s.style.opacity=b%2===0?'1':'0.7';
      }
      if(b>5) clearInterval(bi);
    },250);
  }, 800 + NUM*200 + 1500);
}, 300);

// Verificar — totalmente client-side
const feedbackEl = document.getElementById('feedback');

function verificar(){
  if(fase<1) return;
  const val = document.getElementById('arquivo-input').value.trim();
  if(!val){ feedbackEl.style.color='var(--amber)'; feedbackEl.textContent='> INFORME O ARQUIVO'; return; }

  if(RESPOSTA_CORRETA.test(val)){
    fase=2;
    for(let i=0;i<NUM;i++){
      setTimeout(()=>recover(i), i*120);
    }
    setTimeout(()=>{
      document.getElementById('win-codigo').textContent = CODIGO_FINAL;
      document.getElementById('win-screen').classList.add('show');
    }, NUM*120+600);
  } else {
    feedbackEl.style.color='var(--red)';
    feedbackEl.textContent='> ARQUIVO INCORRETO';
    for(let i=0;i<NUM;i++){
      const s=getScreen(i);
      if(s.classList.contains('bsod')){ s.style.opacity='0.4'; setTimeout(()=>s.style.opacity='1',300); }
    }
    document.getElementById('arquivo-input').value='';
    document.getElementById('arquivo-input').focus();
  }
}

document.getElementById('arquivo-input').addEventListener('keydown',e=>{ if(e.key==='Enter') verificar(); });
</script>
